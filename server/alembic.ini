[alembic]
script_location = alembic
sqlalchemy.url = postgresql://dfu_admin:dfu_password@localhost:5430/dfu_database
 
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
 
[logger_root]
level = WARNING
handlers = console
 
[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic