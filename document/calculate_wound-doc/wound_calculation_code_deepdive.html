from pyzbar import pyzbar
import numpy as np

def detect_qr(image_path, qr_size_cm=2.0):
    img = cv2.imread(image_path)
    if img is None: return None
    
    qr_list = pyzbar.decode(img)
    if not qr_list or len(qr_list[0].polygon) != 4:
        return None
        
    qr = qr_list[0]
    polygon = [[p.x, p.y] for p in qr.polygon]
    pts = np.array(polygon, dtype=np.float32)
    
    qr_area_px = float(cv2.contourArea(pts))
    side_lengths = [np.linalg.norm(pts[i] - pts[(i + 1) % 4]) for i in range(4)]
    px_per_cm = float(np.mean(side_lengths)) / qr_size_cm
    
    return {
        "px_per_cm": px_per_cm,
        "polygon": polygon
    }`,

import torchvision.transforms as transforms
from PIL import Image
import cv2
import numpy as np
import segmentation_models_pytorch as smp

def load_model(model_path, device):
    model = smp.Unet(encoder_name="efficientnet-b4", encoder_weights=None, in_channels=3, classes=1)
    state_dict = torch.load(model_path, map_location=device)
    model.load_state_dict(state_dict, strict=False)
    model.to(device).eval()
    return model

def segment_wound(image_path, model, device, threshold=0.5):
    img = cv2.imread(image_path)
    h, w = img.shape[:2]
    img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
    img_pil = Image.fromarray(img_rgb)
    
    transform = transforms.Compose([
        transforms.Resize((512, 512)),
        transforms.ToTensor(),
        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])
    ])
    img_tensor = transform(img_pil).unsqueeze(0).to(device)
    
    with torch.no_grad():
        logits = model(img_tensor)
        prob = torch.sigmoid(logits).squeeze().cpu().numpy()
        
    prob_resized = cv2.resize(prob, (w, h), interpolation=cv2.INTER_LINEAR)
    mask = (prob_resized > threshold).astype(np.uint8) * 255
    
    wound_pixels_prob = prob[prob > threshold]
    if len(wound_pixels_prob) > 0:
        eps = 1e-7
        p = wound_pixels_prob
        entropy = - (p * np.log2(p + eps) + (1 - p) * np.log2(1 - p + eps))
        avg_entropy = float(np.mean(entropy))
        confidence = float(np.mean(wound_pixels_prob))
    else:
        avg_entropy, confidence = 0.0, 0.0
        
    return {"mask": mask, "confidence": confidence, "avg_entropy": avg_entropy, "img": img}`,

import numpy as np

def warp_image_and_mask(img, mask, qr_polygon, qr_size_cm=2.0, target_px_per_cm=100.0, max_warped_dim=5000):
    src_pts = np.array([
        [qr_polygon[0][0], qr_polygon[0][1]],
        [qr_polygon[3][0], qr_polygon[3][1]],
        [qr_polygon[2][0], qr_polygon[2][1]],
        [qr_polygon[1][0], qr_polygon[1][1]]
    ], dtype="float32")
    
    qr_side_px = qr_size_cm * target_px_per_cm
    dst_pts_ref = np.array([
        [0.0, 0.0],
        [qr_side_px, 0.0],
        [qr_side_px, qr_side_px],
        [0.0, qr_side_px]
    ], dtype="float32")
    
    H = cv2.getPerspectiveTransform(src_pts, dst_pts_ref)
    h, w = img.shape[:2]
    corners = np.array([[0,0], [w-1,0], [w-1,h-1], [0,h-1]], dtype=np.float32).reshape(-1,1,2)
    warped_corners = cv2.perspectiveTransform(corners, H)
    x_coords, y_coords = warped_corners[:,0,0], warped_corners[:,0,1]
    min_x, max_x = np.min(x_coords), np.max(x_coords)
    min_y, max_y = np.min(y_coords), np.max(y_coords)
    warped_w, warped_h = int(np.ceil(max_x - min_x)), int(np.ceil(max_y - min_y))
    
    if warped_w > max_warped_dim or warped_h > max_warped_dim:
        raise ValueError("มุมกล้องถ่ายภาพเอียงลาดชันมากเกินไป กรุณาจัดตั้งกล้องทำมุมตั้งฉากและขนานกับแผลมากขึ้น")
        
    translation_matrix = np.array([[1, 0, -min_x], [0, 1, -min_y], [0, 0, 1]], dtype="float32")
    H_final = np.dot(translation_matrix, H)
    
    warped_img = cv2.warpPerspective(img, H_final, (warped_w, warped_h))
    warped_mask = cv2.warpPerspective(mask, H_final, (warped_w, warped_h), flags=cv2.INTER_NEAREST)
    
    return warped_img, warped_mask, warped_w, warped_h`,

        let activeFile = "project_structure";

        // Helper to update top bar status badge dynamically
        function updateStatusBadge(statusText) {
            const statusEl = document.getElementById("topBarStatus");
            if (statusText) {
                statusEl.innerText = statusText;
                statusEl.style.display = "inline-block";
                if (statusText.includes("แก้ไขเพิ่มเติม")) {
                    statusEl.style.backgroundColor = "#d97706"; // Warning gold/orange
                } else if (statusText.includes("สร้างใหม่")) {
                    statusEl.style.backgroundColor = "#059669"; // Success green
                } else {
                    statusEl.style.backgroundColor = "var(--accent)"; // Info blue/purple
                }
            } else {
                statusEl.style.display = "none";
            }
        }

        // Load Sidebar File Menu
        function loadFile(fileKey) {
            activeFile = fileKey;
            const fileData = fileDatabase[fileKey];

            // Render Navbar Sub-tabs
            const subNav = document.getElementById("subNav");
            subNav.innerHTML = "";

            if (fileData.isFolder) {
                subNav.style.display = "flex";
                Object.keys(fileData.subFiles).forEach((subKey, idx) => {
                    const subFile = fileData.subFiles[subKey];
                    const btn = document.createElement("button");
                    btn.className = `sub-nav-btn ${idx === 0 ? 'active' : ''}`;
                    btn.innerText = subFile.name;
                    btn.onclick = () => loadSubFile(subKey, btn);
                    subNav.appendChild(btn);
                });

                // Auto-load first subfile
                const firstSubKey = Object.keys(fileData.subFiles)[0];
                loadSubFile(firstSubKey, subNav.querySelector(".sub-nav-btn"));
            } else {
                subNav.style.display = "none";
                document.getElementById("topBarTitle").innerText = fileData.name;
                document.getElementById("topBarPath").innerText = fileData.path;
                updateStatusBadge(fileData.fileStatus);
                renderCodePane(fileData);
                renderExplanationPane(fileData, null);
            }
        }

        // Load Sub-file within Folder
        function loadSubFile(subKey, buttonElement) {
            document.querySelectorAll(".sub-nav-btn").forEach(btn => btn.classList.remove("active"));
            buttonElement.classList.add("active");

            const fileData = fileDatabase[activeFile];
            const subFileData = fileData.subFiles[subKey];

            document.getElementById("topBarTitle").innerText = subFileData.name;
            document.getElementById("topBarPath").innerText = subFileData.path;
            updateStatusBadge(subFileData.fileStatus);

            renderCodePane(subFileData);
            renderExplanationPane(subFileData, subKey);
        }

        // Render Code Lines
        function renderCodePane(codeData) {
            const codePane = document.getElementById("codePane");
            codePane.innerHTML = "";

            codeData.htmlCode.forEach((lineText, idx) => {
                const lineNum = idx + 1;
                const lineDiv = document.createElement("div");
                lineDiv.className = "code-line";
                lineDiv.id = `code-line-${lineNum}`;
                lineDiv.innerHTML = `<span class="line-num">${lineNum}</span><span class="line-content">${lineText || ' '}</span>`;
                lineDiv.addEventListener("click", () => highlightLine(lineNum, codeData));
                codePane.appendChild(lineDiv);
            });
        }

        // Render Explanation Cards
        function renderExplanationPane(codeData, subFileKey) {
            const explanationPane = document.getElementById("explanationPane");
            explanationPane.innerHTML = "";

            codeData.explanations.forEach((exp, idx) => {
                const card = document.createElement("div");
                card.className = "explanation-card";
                card.id = `exp-card-${idx}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span>${exp.title}</span>
                        <span class="card-tag">บรรทัดที่ ${exp.lines[0]} - ${exp.lines[1]}</span>
                    </div>
                    <div class="tabs-container">
                        <button class="tab-btn active" onclick="switchCardTab(this, ${idx}, 'what', '${subFileKey}')">🔎 คืออะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'get', '${subFileKey}')">🎁 ได้อะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'why', '${subFileKey}')">💡 ทำไมต้องทำ</button>
                    </div>
                    <div class="tab-content" id="card-content-${idx}">
                        ${exp.what}
                    </div>
                `;

                card.addEventListener("click", () => {
                    highlightLinesRange(exp.lines[0], exp.lines[1]);
                    document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });

                explanationPane.appendChild(card);
            });
        }

        // Highlight single line click
        function highlightLine(lineNum, codeData) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            const targetLine = document.getElementById(`code-line-${lineNum}`);
            if (targetLine) targetLine.classList.add("highlighted");

            const explanations = codeData.explanations;
            const expIdx = explanations.findIndex(exp => lineNum >= exp.lines[0] && lineNum <= exp.lines[1]);

            if (expIdx !== -1) {
                document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                const card = document.getElementById(`exp-card-${expIdx}`);
                if (card) {
                    card.classList.add('active');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // Highlight lines range click
        function highlightLinesRange(start, end) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            for (let i = start; i <= end; i++) {
                const line = document.getElementById(`code-line-${i}`);
                if (line) line.classList.add("highlighted");
            }
            const firstLine = document.getElementById(`code-line-${start}`);
            if (firstLine) {
                firstLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Card Tab Switching
        function switchCardTab(button, cardIdx, type, subFileKey) {
            event.stopPropagation();
            const card = button.closest('.explanation-card');
            card.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            const contentDiv = document.getElementById(`card-content-${cardIdx}`);
            let expData;

            const fileData = fileDatabase[activeFile];
            if (fileData.isFolder) {
                expData = fileData.subFiles[subFileKey].explanations[cardIdx];
            } else {
                expData = fileData.explanations[cardIdx];
            }

            if (type === 'what') {
                contentDiv.innerHTML = expData.what;
            } else if (type === 'get') {
                contentDiv.innerHTML = expData.get;
            } else if (type === 'why') {
                contentDiv.innerHTML = expData.why;
            }
        }

        // Copy Entire Active Code Text to Clipboard
        function copyEntireActiveFile() {
            const fileData = fileDatabase[activeFile];
            let raw = fileData.rawCode;

            if (fileData.isFolder) {
                const activeBtn = document.querySelector(".sub-nav-btn.active");
                if (activeBtn) {
                    const subFileName = activeBtn.innerText;
                    const subFileKey = Object.keys(fileData.subFiles).find(key => fileData.subFiles[key].name === subFileName);
                    raw = fileData.subFiles[subFileKey].rawCode;
                }
            }

            navigator.clipboard.writeText(raw).then(() => {
                const copyBtn = document.getElementById("btn-copy-main");
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.style.color = "var(--success)";
                copyBtn.style.borderColor = "var(--success)";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.color = "var(--text-body)";
                    copyBtn.style.borderColor = "var(--border)";
                }, 2000);
            });
        }

        // Sidebar Item Click Handlers
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                const fileKey = this.getAttribute('data-file');
                loadFile(fileKey);
            });
        });

        // Initialize First View
        window.onload = () => {
            loadFile("project_structure");
        };
    </script>
