from pyzbar import pyzbar
import numpy as np

def detect_qr(image_path, qr_size_cm=2.0):
    """
    ตรวจหาตำแหน่งกล่องสติกเกอร์ QR Code ในรูปแผลเบาหวาน
    เพื่อคำนวณมาตราส่วนพิกเซลต่อเซนติเมตรราบ (px/cm) ปรับแก้ระยะทางกล้อง
    """
    # 1. โหลดรูปแผลจากพิกัดไดเรกทอรี
    img = cv2.imread(image_path)
    if img is None: return None
    
    # 2. คัดกรองและสแกนค้นหาบาร์โค้ดหรือ QR Code ทั้งหมดในภาพ
    qr_list = pyzbar.decode(img)
    # หากตรวจไม่พบ หรือสติกเกอร์ QR โดนนิ้วบังจนตรวจจุดมุมไม่ครบทิศทาง (ต้องมี 4 จุด) ให้ตีกลับเป็น None
    if not qr_list or len(qr_list[0].polygon) != 4:
        return None
        
    qr = qr_list[0]
    # 3. จัดแจงดึงพิกัด (X, Y) ทั้ง 4 มุมของสติกเกอร์
    polygon = [[p.x, p.y] for p in qr.polygon]
    pts = np.array(polygon, dtype=np.float32)
    
    # 4. [คณิตศาสตร์สูตรเชือกผูกรองเท้า (Shoelace Formula)]
    # คำนวณหาขนาดพื้นที่รวมพิกเซลราบของ QR Code โดยปัดปัญหาการเอียงมุมราบออกไป
    qr_area_px = float(cv2.contourArea(pts))
    
    # 5. หาค่าเฉลี่ยระยะความกว้างของสติกเกอร์ทั้ง 4 ด้าน เพื่อเฉลี่ยระดับระยะห่างกล้อง
    side_lengths = [np.linalg.norm(pts[i] - pts[(i + 1) % 4]) for i in range(4)]
    # สเกลพิกเซลต่อ 1 ซม. = ความกว้างพิกเซลเฉลี่ยหารด้วยขนาดสติกเกอร์จริง (2 ซม.)
    px_per_cm = float(np.mean(side_lengths)) / qr_size_cm
    
    return {
        "px_per_cm": px_per_cm,  # อัตราความหนาแน่นพิกเซลต่อเซนติเมตร
        "polygon": polygon       # พิกัดสี่มุมยอดของ QR บนระนาบรูปดิบ
    }`,

def load_model(model_path, device):
    """
    ฟังก์ชันโหลดตัวโครงข่ายโมเดลวิเคราะห์แผล U-Net เข้าสู่แรมระบบเพื่อเตรียมทำนายผล
    """
    # ใช้สถาปัตยกรรม U-Net ร่วมกับแกนย่อระดับพิกเซลพรีเมียม EfficientNet-B4

    state_dict = torch.load(model_path, map_location=device)
    model.load_state_dict(state_dict, strict=False)
    model.to(device).eval()  # ตั้งโหมดประเมินความปลอดภัย (Eval Mode)
    return model

def segment_wound(image_path, model, device, threshold=0.5):
    """
    ตรวจและสร้างขอบเขตแผล (Binary Mask) พร้อมคำนวณระดับความเปื่อยอักเสบขอบแผล (Shannon Entropy)
    """
    # 1. อ่านรูปแผลและแปลงรหัสสีเป็นมาตรฐาน RGB
    img = cv2.imread(image_path)
    h, w = img.shape[:2]
    img_rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
    img_pil = Image.fromarray(img_rgb)
    
    # 2. ปรับสเกลย่อยภาพถ่ายแผลเป็นสี่เหลี่ยมจัตุรัส 512x512 และล้างเกลี่ยสภาพแสงด้วยสถิติ ImageNet
    transform = transforms.Compose([
        transforms.Resize((512, 512)),
        transforms.ToTensor(),
        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])
    ])
    img_tensor = transform(img_pil).unsqueeze(0).to(device)
    
    # 3. ป้อนผ่านกระบวนการโครงข่ายประสาทเพื่อทำนายผลลัพธ์พิกเซลแผล
    with torch.no_grad():
        logits = model(img_tensor)
        prob = torch.sigmoid(logits).squeeze().cpu().numpy()
        
    # 4. ขยายพิกัดความละเอียดทำนายสีกลับมาเท่ารูปถ่ายต้นฉบับ เพื่อไม่ให้ขอบเบลอ
    prob_resized = cv2.resize(prob, (w, h), interpolation=cv2.INTER_LINEAR)
    # แยกสีดำ(ไม่ใช่แผล = 0) และขาว(เนื้อแผลจริง = 255) ด้วยเกณฑ์ Threshold
    mask = (prob_resized > threshold).astype(np.uint8) * 255
    
    # 5. [ระบบเตือนอักเสบแดงผิวขอบแผลล่วงหน้า - Shannon Entropy]

    wound_pixels_prob = prob[prob > threshold]
    if len(wound_pixels_prob) > 0:

        p = wound_pixels_prob
        # คำนวณหาค่าความบิดเบี้ยวเอนโทรปีสะสม
        entropy = - (p * np.log2(p + eps) + (1 - p) * np.log2(1 - p + eps))
        avg_entropy = float(np.mean(entropy))
        confidence = float(np.mean(wound_pixels_prob))
    else:
        avg_entropy, confidence = 0.0, 0.0
        
    return {
        "mask": mask,                 # ขอบเขตแผลขาวดำขนาดต้นฉบับ
        "confidence": confidence,     # ค่าเฉลี่ยความชัวร์ของ AI ต่อเนื้อแผล
        "avg_entropy": avg_entropy,   # อัตราความเปื่อยอักเสบแดงรอบแผล
        "img": img                    # รูปดิบดั้งเดิม
    }`,

import numpy as np

def warp_image_and_mask(img, mask, qr_polygon, qr_size_cm=2.0, target_px_per_cm=100.0, max_warped_dim=5000):
    """
    ใช้เมตริกซ์ Homography เพื่อดึงระนาบเท้าลาดเอียงให้เรียบหน้าตรงขนานหน้าเลนส์ 90 องศาคงที่
    """
    # 1. เรียงจัดยอดมุมพิกัด QR จากเฉียงซ้ายไปขวา
    src_pts = np.array([
        [qr_polygon[0][0], qr_polygon[0][1]],  # บน-ซ้าย (Top-Left)
        [qr_polygon[3][0], qr_polygon[3][1]],  # บน-ขวา (Top-Right)
        [qr_polygon[2][0], qr_polygon[2][1]],  # ล่าง-ขวา (Bottom-Right)
        [qr_polygon[1][0], qr_polygon[1][1]]   # ล่าง-ซ้าย (Bottom-Left)
    ], dtype="float32")
    
    # 2. ปักหมุดเป้าหมายหน้าตรงที่ตึงเรียบกว้างยาว 200x200 พิกเซล (คำนวณจาก 2.0 cm * 100 px/cm)
    qr_side_px = qr_size_cm * target_px_per_cm
    dst_pts_ref = np.array([
        [0.0, 0.0],
        [qr_side_px, 0.0],
        [qr_side_px, qr_side_px],
        [0.0, qr_side_px]
    ], dtype="float32")
    
    # 3. สรรค์สร้างตรรกะแปลงพิกัดเฉียงเป็นขนานตรง (Homography Matrix)
    H = cv2.getPerspectiveTransform(src_pts, dst_pts_ref)
    h, w = img.shape[:2]
    
    # 4. [ขั้นตอนป้องกันแผลโดนเบียดหลุดขอบจอสีดำ (Translation Matrix)]
    # ประเมินหาขนาดกรอบรูปหลังปรับบิดตรงทั้งหมดเพื่อหาพิกัดกว้างยาวใหม่
    corners = np.array([[0,0], [w-1,0], [w-1,h-1], [0,h-1]], dtype=np.float32).reshape(-1,1,2)
    warped_corners = cv2.perspectiveTransform(corners, H)
    x_coords, y_coords = warped_corners[:,0,0], warped_corners[:,0,1]
    min_x, max_x = np.min(x_coords), np.max(x_coords)
    min_y, max_y = np.min(y_coords), np.max(y_coords)
    warped_w, warped_h = int(np.ceil(max_x - min_x)), int(np.ceil(max_y - min_y))
    
    # ตรวจเช็คเกณฑ์ภัยพิบัติหากมือถือลาดเอียงจัดระดับขนานพื้น (ป้องกันหน่วยความจำล้นจากการสร้างพิกเซลใหญ่)
    if warped_w > max_warped_dim or warped_h > max_warped_dim:
        raise ValueError("มุมกล้องถ่ายภาพเอียงลาดชันมากเกินไป กรุณาจัดตั้งกล้องทำมุมตั้งฉากและขนานกับแผลมากขึ้น")
        
    # เลื่อนขยับสิกแนลลบชดเชยค่าว่างพิกเซลขอบจอ กลับเข้ามาอยู่ในกรอบพื้นที่ประมวลผลบวกทั้งหมด
    translation_matrix = np.array([[1, 0, -min_x], [0, 1, -min_y], [0, 0, 1]], dtype="float32")
    H_final = np.dot(translation_matrix, H)
    
    # 5. สั่งยืดระนาบแผ่นยางหน้าตรงสำหรับภาพสี และภาพหน้ากากแผล
    warped_img = cv2.warpPerspective(img, H_final, (warped_w, warped_h))
    warped_mask = cv2.warpPerspective(mask, H_final, (warped_w, warped_h), flags=cv2.INTER_NEAREST)
    
    return warped_img, warped_mask, warped_w, warped_h`,

import os
import cv2
import numpy as np

# --- โค้ดเชื่อมต่อระบบจำลอง (Continuation System Path) ---
# สั่งถอยพิกัดขึ้น 1 ลำดับ เพื่อลงทะเบียนโฟลเดอร์หลักหลังบ้านให้ Import คลาส app ข้ามแพ็กเกจได้
sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), "..")))

from app.core.config import settings
from app.services.qr_detector import detect_qr
from app.services.wound_segmenter import load_model, segment_wound
from app.services.image_rectifier import warp_image_and_mask

def run_sandbox(image_path):
    print("🚀 สตาร์ททดสอบเอนจิน AI & ปรับสเกลภาพแผล...")
    # 1. สั่งโหลดโมเดลประสาทเทียมตรวจแผล
    model = load_model(settings.MODEL_PATH, settings.DEVICE)
    
    # 2. ค้นหาสติกเกอร์ QR และพิกัดยอดมุม
    qr_data = detect_qr(image_path, settings.QR_SIZE_CM)
    if not qr_data:
        print("❌ ไม่พบป้ายอ้างอิง QR Code!")
        return
        
    # 3. รันคัดกรองพื้นที่แผลสีขาวดำจาก U-Net AI
    wound_data = segment_wound(image_path, model, settings.DEVICE, settings.THRESHOLD)
    
    # 4. บิดแผ่นระนาบภาพถ่ายเท้าเฉียง ให้เป็นแผลระนาบตรงหน้าตรง
    warped_img, warped_mask, warped_w, warped_h = warp_image_and_mask(
        wound_data["img"], wound_data["mask"], qr_data["polygon"],
        settings.QR_SIZE_CM, settings.TARGET_PX_PER_CM, settings.MAX_WARPED_DIM
    )
    
    # 5. [ระบบสูตรสากลคงที่วิเคราะห์พื้นที่ ซม. จริงคงที่ (Scale Factor = 0.0001)]
    # นับจำนวนพิกเซลแผลสีขาวในภาพแบนราบหน้าตรง
    pixels_rectified = int(np.sum(warped_mask > 0))
    # หาอัตราส่วนพิกเซลต่อ cm2: ขนาดจริง QR 4 ซม.2 หารด้วยพื้นที่พิกเซลตรงของมัน (200x200 = 40,000 px)
    scale_factor = 4.0 / (200.0 * 200.0) # 0.0001 cm2/px
    area_cm2 = pixels_rectified * scale_factor
    
    print("="*50)
    print(f"📊 ผลคำนวณพื้นที่แผลจริง: {area_cm2:.4f} cm²")
    print(f"📉 ระดับ Shannon Entropy : {wound_data['avg_entropy']:.4f}")
    print(f"🩹 พิกเซลแผลหน้าตรง       : {pixels_rectified:,} px")
    print("="*50)

if __name__ == "__main__":
    # ใส่รูปแผลทดสอบ 'test.jpg' ไว้ใน server/scratch/inputs/ เพื่อตรวจรัน
    run_sandbox("scratch/inputs/test.jpg")`,

        let activeFile = "folders_map";

        // Helper to update top bar status badge dynamically
        function updateStatusBadge(statusText) {
            const statusEl = document.getElementById("topBarStatus");
            if (statusText) {
                statusEl.innerText = statusText;
                statusEl.style.display = "inline-block";
                if (statusText.includes("แก้ไขเพิ่มเติม")) {
                    statusEl.style.backgroundColor = "#d97706"; // Warning gold/orange
                } else if (statusText.includes("สร้างใหม่")) {
                    statusEl.style.backgroundColor = "#059669"; // Success green
                } else {
                    statusEl.style.backgroundColor = "var(--accent)"; // Info blue/purple
                }
            } else {
                statusEl.style.display = "none";
            }
        }

        // Load Sidebar File Menu
        function loadFile(fileKey) {
            activeFile = fileKey;
            const fileData = fileDatabase[fileKey];

            document.getElementById("topBarTitle").innerText = fileData.name;
            document.getElementById("topBarPath").innerText = fileData.path;
            updateStatusBadge(fileData.fileStatus);
            renderCodePane(fileData);
            renderExplanationPane(fileData);
        }

        // Render Code Lines
        function renderCodePane(codeData) {
            const codePane = document.getElementById("codePane");
            codePane.innerHTML = "";

            codeData.htmlCode.forEach((lineText, idx) => {
                const lineNum = idx + 1;
                const lineDiv = document.createElement("div");
                lineDiv.className = "code-line";
                lineDiv.id = `code-line-${lineNum}`;
                lineDiv.innerHTML = `<span class="line-num">${lineNum}</span><span class="line-content">${lineText || ' '}</span>`;
                lineDiv.addEventListener("click", () => highlightLine(lineNum, codeData));
                codePane.appendChild(lineDiv);
            });
        }

        // Highlight single line click
        function highlightLine(lineNum, codeData) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            const targetLine = document.getElementById(`code-line-${lineNum}`);
            if (targetLine) targetLine.classList.add("highlighted");

            const explanations = codeData.explanations;
            const expIdx = explanations.findIndex(exp => lineNum >= exp.lines[0] && lineNum <= exp.lines[1]);

            if (expIdx !== -1) {
                document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                const card = document.getElementById(`exp-card-${expIdx}`);
                if (card) {
                    card.classList.add('active');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // Highlight lines range click
        function highlightLinesRange(start, end) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            for (let i = start; i <= end; i++) {
                const line = document.getElementById(`code-line-${i}`);
                if (line) line.classList.add("highlighted");
            }
            const firstLine = document.getElementById(`code-line-${start}`);
            if (firstLine) {
                firstLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Card Tab Switching
        function switchCardTab(button, cardIdx, type) {
            event.stopPropagation();
            const card = button.closest('.explanation-card');
            card.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            const contentDiv = document.getElementById(`card-content-${cardIdx}`);
            const fileData = fileDatabase[activeFile];
            const expData = fileData.explanations[cardIdx];

            if (type === 'what') {
                contentDiv.innerHTML = expData.what;
            } else if (type === 'get') {
                contentDiv.innerHTML = expData.get;
            } else if (type === 'why') {
                contentDiv.innerHTML = expData.why;
            }
        }

        // Render Explanation Cards
        function renderExplanationPane(codeData) {
            const explanationPane = document.getElementById("explanationPane");
            explanationPane.innerHTML = "";

            codeData.explanations.forEach((exp, idx) => {
                const card = document.createElement("div");
                card.className = "explanation-card";
                card.id = `exp-card-${idx}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span>${exp.title}</span>
                        <span class="card-tag">บรรทัดที่ ${exp.lines[0]} - ${exp.lines[1]}</span>
                    </div>
                    <div class="tabs-container">
                        <button class="tab-btn active" onclick="switchCardTab(this, ${idx}, 'what')">🔎 คืออะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'get')">🎁 ได้อะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'why')">💡 ทำไมต้องทำ</button>
                    </div>
                    <div class="tab-content" id="card-content-${idx}">
                        ${exp.what}
                    </div>
                `;

                card.addEventListener("click", () => {
                    highlightLinesRange(exp.lines[0], exp.lines[1]);
                    document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });

                explanationPane.appendChild(card);
            });
        }

        // Copy Entire Active Code Text to Clipboard
        function copyEntireActiveFile() {
            const fileData = fileDatabase[activeFile];
            navigator.clipboard.writeText(fileData.rawCode).then(() => {
                const copyBtn = document.getElementById("btn-copy-main");
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.style.color = "var(--success)";
                copyBtn.style.borderColor = "var(--success)";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.color = "var(--text-body)";
                    copyBtn.style.borderColor = "var(--border)";
                }, 2000);
            });
        }

        // Sidebar Item Click Handlers
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                const fileKey = this.getAttribute('data-file');
                loadFile(fileKey);
            });
        });

        // Initialize First View
        window.onload = () => {
            loadFile("folders_map");
        };
    </script>
