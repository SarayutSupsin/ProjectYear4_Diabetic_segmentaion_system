    <!-- Styling -->
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-sidebar: #0f1524;
            --bg-panel: #141b2d;
            --bg-code: #070a12;
            --primary: #3b82f6;
            --primary-grad: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent: #a855f7;
            --border: #223049;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --text-muted: #4b5563;
            --success: #10b981;
            --radius-lg: 16px;
            --radius-md: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Menu */
        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 36px;
            height: 36px;
            background: var(--primary-grad);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .brand h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            color: var(--text-title);
        }

        .brand p {
            font-size: 10px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .menu-item button {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-body);
            border-radius: var(--radius-md);
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }

        .menu-item button:hover {
            background-color: rgba(59, 130, 246, 0.04);
            color: var(--primary);
        }

        .menu-item.active button {
            background: var(--primary-grad);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
        }

        /* Workspace split screen */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .top-bar {
            min-height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background-color: var(--bg-sidebar);
            flex-shrink: 0;
        }

        .top-bar-title-container {
            display: flex;
            flex-direction: column;
        }

        .top-bar h3 {
            font-family: 'Outfit', 'Sarabun', sans-serif;
            color: var(--text-title);
            font-size: 16px;
            line-height: 1.2;
        }

        .btn-copy {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .btn-copy:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .split-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            height: calc(100vh - 70px);
        }

        /* Sub Navigation for Packages/Folders */
        .sub-nav {
            display: flex;
            gap: 6px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            padding: 10px 24px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .sub-nav-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .sub-nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .sub-nav-btn.active {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }

        .pane-code {
            width: 55%;
            background-color: var(--bg-code);
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding: 24px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12.5px;
            color: #e2e8f0;
            position: relative;
        }

        .code-line {
            display: flex;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
        }

        .code-line:hover {
            background-color: rgba(59, 130, 246, 0.05);
            border-left-color: rgba(59, 130, 246, 0.3);
        }

        .code-line.highlighted {
            background-color: rgba(59, 130, 246, 0.12) !important;
            border-left-color: var(--primary) !important;
        }

        .line-num {
            width: 30px;
            color: var(--text-muted);
            text-align: right;
            margin-right: 16px;
            user-select: none;
        }

        .line-content {
            white-space: pre;
            flex-grow: 1;
        }

        /* Right Pane: Explanations */
        .pane-explanation {
            width: 45%;
            background-color: var(--bg-panel);
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .explanation-card {
            border: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.01);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: var(--transition);
            opacity: 0.7;
        }

        .explanation-card.active {
            opacity: 1;
            border-color: var(--primary);
            background-color: rgba(59, 130, 246, 0.03);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.05);
        }

        .card-header {
            font-weight: 700;
            color: var(--text-title);
            font-size: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tag {
            font-size: 11px;
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;

        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-body);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary-grad);
            color: white;
            border-color: transparent;
            font-weight: 600;
        }

        .tab-content {
            font-size: 13.5px;
            color: var(--text-body);
            min-height: 80px;
            line-height: 1.6;
            animation: tabFadeIn 0.3s ease;
        }

        @keyframes tabFadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Comment Token Styling */
        .c-comment {
            color: #6a737d;
            font-style: italic;
        }

        .c-keyword {
            color: #f97583;
            font-weight: bold;
        }

        .c-string {
            color: #9ecbff;
        }

        .c-class {
            color: #b392f0;
            font-weight: bold;
        }

        .c-func {
            color: #79b8ff;
        }

        .c-decorator {
            color: #ffab70;
        }

        .c-number {
            color: #ff79c6;
        }
    </style>
</head>

      timeout: 5s
      retries: 5

      context: ./server
      dockerfile: Dockerfile
    container_name: dfu-api
    ports:
      - "8000:8000"
    depends_on:

        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:

from logging.config import fileConfig
from sqlalchemy import engine_from_config, pool
from alembic import context

sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), '..')))

from app.core.config import settings
from app.db.base_class import Base
from app.models import Role, User, Nurse, Patient, BodyPart, Wound, WoundRecord, Appointment

config = context.config
config.set_main_option("sqlalchemy.url", settings.DATABASE_URL)

if config.config_file_name is not None:
    fileConfig(config.config_file_name)

target_metadata = Base.metadata

def run_migrations_offline() -> None:
    url = config.get_main_option("sqlalchemy.url")
    context.configure(url=url, target_metadata=target_metadata, literal_binds=True, dialect_opts={"paramstyle": "named"})
    with context.begin_transaction():
        context.run_migrations()

def run_migrations_online() -> None:
    connectable = engine_from_config(config.get_section(config.config_ini_section, {}), prefix="sqlalchemy.", poolclass=pool.NullPool)
    with connectable.connect() as connection:
        context.configure(connection=connection, target_metadata=target_metadata)
        with context.begin_transaction():
            context.run_migrations()

if context.is_offline_mode():
    run_migrations_offline()
else:
    run_migrations_online()`,

                    `    <span class="c-keyword">return</span> [{<span class="c-string">"id"</span>: p.body_part_id, "name": p.body_part_name} <span class="c-keyword">for</span> p <span class="c-keyword">in</span> parts]`
                ],
                explanations: [
                    {

                        get: "ระบบหลังบ้านความเร็วสูงที่คอยดักรับสตรีมข้อมูลภาพถ่ายแผล และสร้างเว็บหน้าทดสอบ API Docs (Swagger UI) ให้เรากดยิงทดลองเขียนแผลแบบอัตโนมัติสำเร็จรูป",
                        why: "เพื่อทำหน้าที่เป็นผู้ประสานงานหลัก (Coordinator) ในการเปิดเส้นทางเว็บคิวรีข้ามโปรโตคอลให้แอปมือถือหรือเว็บหลังบ้านสามารถส่งรูปแผลมาคำนวณสเกลได้"

                        get: "ระบบ Sanity Check ที่จะคอยการันตีบอกโปรแกรมเมอร์อย่างมั่นใจว่า ตัว API และระบบ Postgres จำลองในตู้ Docker คุยกันอย่างปกติสมบูรณ์",

        let activeFile = "folder_structure";
        let activeLineIndex = null;

        const codePane = document.getElementById("code-pane");
        const explanationPane = document.getElementById("explanation-pane");
        const fileTitle = document.getElementById("current-file-title");
        const workspaceRoot = document.getElementById("workspace-root");

        function loadFile(fileKey, subFileKey = null) {
            activeFile = fileKey;

            // Clear sub-nav if it exists
            const existingSubNav = document.getElementById("sub-nav-container");
            if (existingSubNav) {
                existingSubNav.remove();
            }

            const fileData = fileDatabase[fileKey];
            let codeData = fileData;
            let displayPath = fileData.path;

            if (fileData.isFolder) {
                if (!subFileKey) {
                    subFileKey = fileData.defaultSubFile;
                }
                codeData = fileData.subFiles[subFileKey];
                displayPath = codeData.path;

                fileTitle.innerHTML = `${fileData.title} &gt; ${codeData.name}<br><span style="font-size: 13.5px; color: var(--primary); font-weight: 500; display: block; margin-top: 4px;">📍 สร้างไฟล์ที่พาธ: <code>${displayPath}</code></span>`;

                // Create sub-nav buttons
                const subNavDiv = document.createElement("div");
                subNavDiv.id = "sub-nav-container";
                subNavDiv.className = "sub-nav";

                Object.keys(fileData.subFiles).forEach(key => {
                    const btn = document.createElement("button");
                    btn.className = "sub-nav-btn" + (key === subFileKey ? " active" : "");
                    btn.innerText = fileData.subFiles[key].name;
                    btn.addEventListener("click", () => {
                        loadFile(fileKey, key);
                    });
                    subNavDiv.appendChild(btn);
                });

                // Insert sub-nav immediately below the top bar
                const topBar = document.querySelector(".top-bar");
                topBar.insertAdjacentElement('afterend', subNavDiv);
            } else {
                if (displayPath) {
                    fileTitle.innerHTML = `${fileData.title}<br><span style="font-size: 13.5px; color: var(--primary); font-weight: 500; display: block; margin-top: 4px;">📍 สร้างไฟล์ที่พาธ: <code>${displayPath}</code></span>`;
                } else {
                    fileTitle.innerText = fileData.title;
                }
            }

            activeLineIndex = null;

            codePane.innerHTML = "";
            codeData.htmlCode.forEach((lineText, idx) => {
                const lineNum = idx + 1;
                const lineDiv = document.createElement("div");
                lineDiv.className = "code-line";
                lineDiv.id = `code-line-${lineNum}`;
                lineDiv.innerHTML = `<span class="line-num">${lineNum}</span><span class="line-content">${lineText || ' '}</span>`;
                lineDiv.addEventListener("click", () => highlightLine(lineNum, codeData));
                codePane.appendChild(lineDiv);
            });

            explanationPane.innerHTML = "";
            codeData.explanations.forEach((exp, idx) => {
                const card = document.createElement("div");
                card.className = "explanation-card";
                card.id = `exp-card-${idx}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span>${exp.title}</span>
                        <span class="card-tag">บรรทัดที่ ${exp.lines[0]} - ${exp.lines[1]}</span>
                    </div>
                    <div class="tabs-container">
                        <button class="tab-btn active" onclick="switchCardTab(this, ${idx}, 'what', '${subFileKey}')">🔎 คืออะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'get', '${subFileKey}')">🎁 ได้อะไร</button>
                        <button class="tab-btn" onclick="switchCardTab(this, ${idx}, 'why', '${subFileKey}')">💡 ทำไมต้องทำ</button>
                    </div>
                    <div class="tab-content" id="card-content-${idx}">
                        ${exp.what}
                    </div>
                `;

                card.addEventListener("click", () => {
                    highlightLinesRange(exp.lines[0], exp.lines[1]);
                    document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });

                explanationPane.appendChild(card);
            });
        }

        function highlightLine(lineNum, codeData) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            const targetLine = document.getElementById(`code-line-${lineNum}`);
            if (targetLine) targetLine.classList.add("highlighted");

            const explanations = codeData.explanations;
            const expIdx = explanations.findIndex(exp => lineNum >= exp.lines[0] && lineNum <= exp.lines[1]);

            if (expIdx !== -1) {
                document.querySelectorAll('.explanation-card').forEach(c => c.classList.remove('active'));
                const card = document.getElementById(`exp-card-${expIdx}`);
                if (card) {
                    card.classList.add('active');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function highlightLinesRange(start, end) {
            document.querySelectorAll(".code-line").forEach(l => l.classList.remove("highlighted"));
            for (let i = start; i <= end; i++) {
                const line = document.getElementById(`code-line-${i}`);
                if (line) line.classList.add("highlighted");
            }
            const firstLine = document.getElementById(`code-line-${start}`);
            if (firstLine) {
                firstLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function switchCardTab(button, cardIdx, type, subFileKey) {
            event.stopPropagation();
            const card = button.closest('.explanation-card');
            card.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            const contentDiv = document.getElementById(`card-content-${cardIdx}`);
            let expData;

            const fileData = fileDatabase[activeFile];
            if (fileData.isFolder) {
                expData = fileData.subFiles[subFileKey].explanations[cardIdx];
            } else {
                expData = fileData.explanations[cardIdx];
            }

            if (type === 'what') {
                contentDiv.innerHTML = expData.what;
            } else if (type === 'get') {
                contentDiv.innerHTML = expData.get;
            } else if (type === 'why') {
                contentDiv.innerHTML = expData.why;
            }
        }

        function copyEntireActiveFile() {
            const fileData = fileDatabase[activeFile];
            let raw = fileData.rawCode;

            if (fileData.isFolder) {
                const activeBtn = document.querySelector(".sub-nav-btn.active");
                if (activeBtn) {
                    const subFileName = activeBtn.innerText;
                    const subFileKey = Object.keys(fileData.subFiles).find(key => fileData.subFiles[key].name === subFileName);
                    raw = fileData.subFiles[subFileKey].rawCode;
                }
            }

            navigator.clipboard.writeText(raw).then(() => {
                const copyBtn = document.getElementById("btn-copy-main");
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied File!";
                copyBtn.style.color = "var(--success)";
                copyBtn.style.borderColor = "var(--success)";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.color = "var(--text-body)";
                    copyBtn.style.borderColor = "var(--border)";
                }, 2000);
            });
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                const fileKey = this.getAttribute('data-file');
                loadFile(fileKey);
            });
        });

        window.addEventListener("DOMContentLoaded", () => {
            loadFile("folder_structure");
        });
    </script>
</body>

</html>
