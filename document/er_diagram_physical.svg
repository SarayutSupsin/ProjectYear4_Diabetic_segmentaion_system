<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 770" width="100%" height="100%" style="background-color: #121214; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Line Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4da6ff" />
    </marker>
    <marker id="circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#ffb86c" stroke="#121214" stroke-width="1.5" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="35" y="38" fill="#e1e1e6" font-size="20" font-weight="700">Entity-Relationship Diagram (Physical Database Schema)</text>
  <text x="35" y="60" fill="#8d8d99" font-size="12">Direct Key-to-Key Relationships (Mapped 1:1 from server/app/models/)</text>

  <!-- RELATIONSHIP LINES (Key to Key Paths) -->

  <!-- 1. role.role_id -> users.role_id -->
  <path d="M 270 245 L 320 275" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 2. users.user_id -> nurse.user_id -->
  <path d="M 390 220 L 390 170" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 3. users.user_id -> patients.HN -->
  <path d="M 560 220 C 590 220, 590 100, 620 100" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 4. users.user_id -> wound_records.user_id -->
  <path d="M 560 250 C 610 250, 610 555, 660 555" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 5. users.user_id -> appointments.nurse_user_id -->
  <path d="M 440 370 L 440 480" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 6. patients.HN -> wounds.HN -->
  <path d="M 870 100 C 905 100, 905 275, 940 275" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 7. patients.HN -> appointments.HN -->
  <path d="M 620 120 C 500 120, 500 555, 580 555" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 8. body_parts.body_part_id -> wounds.body_part_id -->
  <path d="M 1055 130 L 1055 285" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- 9. wounds.wound_id -> wound_records.wound_id -->
  <path d="M 940 245 C 900 245, 900 525, 930 525" stroke="#4da6ff" stroke-width="2" fill="none" marker-start="url(#circle)" marker-end="url(#arrow)" opacity="0.85"/>


  <!-- TABLE CARDS -->

  <!-- 1. ROLE TABLE -->
  <g transform="translate(50, 180)" filter="url(#shadow)">
    <rect width="220" height="100" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="220" height="34" rx="6" fill="#292933"/>
    <text x="110" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">role</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#33333f" stroke-width="1.5"/>
    <!-- Row 1 -->
    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">role_id <tspan fill="#8d8d99" font-weight="400">(VARCHAR 5)</tspan></text>
    <line x1="0" y1="64" x2="220" y2="64" stroke="#2a2a35" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="0" y="64" width="45" height="34" fill="#1e1e24"/>
    <text x="55" y="85" fill="#e1e1e6" font-size="12">role_name <tspan fill="#8d8d99">(VARCHAR 20)</tspan></text>
  </g>

  <!-- 2. USERS TABLE -->
  <g transform="translate(320, 180)" filter="url(#shadow)">
    <rect width="240" height="190" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="240" height="34" rx="6" fill="#292933"/>
    <text x="120" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">users</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#33333f" stroke-width="1.5"/>
    <!-- Rows -->
    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">user_id <tspan fill="#8d8d99" font-weight="400">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="64" x2="240" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="64" width="45" height="30" fill="#24242d"/>
    <text x="22" y="84" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="84" fill="#e1e1e6" font-size="12">role_id <tspan fill="#8d8d99">(VARCHAR 5)</tspan></text>
    <line x1="0" y1="94" x2="240" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="114" fill="#e1e1e6" font-size="12">username <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="124" x2="240" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="144" fill="#e1e1e6" font-size="12">password <tspan fill="#8d8d99">(VARCHAR 255)</tspan></text>
    <line x1="0" y1="154" x2="240" y2="154" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="174" fill="#e1e1e6" font-size="12">created_at <tspan fill="#8d8d99">(DATETIME)</tspan></text>
  </g>

  <!-- 3. NURSE TABLE -->
  <g transform="translate(320, 30)" filter="url(#shadow)">
    <rect width="240" height="140" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="240" height="34" rx="6" fill="#292933"/>
    <text x="120" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">nurse</text>
    <line x1="0" y1="34" x2="240" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff79c6" font-size="10" font-weight="700" text-anchor="middle">PK/FK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">user_id <tspan fill="#8d8d99" font-weight="400">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="64" x2="240" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="84" fill="#e1e1e6" font-size="12">first_name <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="94" x2="240" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="114" fill="#e1e1e6" font-size="12">last_name <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="124" x2="240" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="134" fill="#e1e1e6" font-size="12">department <tspan fill="#8d8d99">(VARCHAR 100)</tspan></text>
  </g>

  <!-- 4. PATIENTS TABLE -->
  <g transform="translate(620, 30)" filter="url(#shadow)">
    <rect width="250" height="230" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="250" height="34" rx="6" fill="#292933"/>
    <text x="125" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">patients</text>
    <line x1="0" y1="34" x2="250" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff79c6" font-size="10" font-weight="700" text-anchor="middle">PK/FK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">HN <tspan fill="#8d8d99" font-weight="400">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="64" x2="250" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="84" fill="#e1e1e6" font-size="12">first_name <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="94" x2="250" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="114" fill="#e1e1e6" font-size="12">last_name <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="124" x2="250" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="144" fill="#e1e1e6" font-size="12">birth_date <tspan fill="#8d8d99">(DATE)</tspan></text>
    <line x1="0" y1="154" x2="250" y2="154" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="174" fill="#e1e1e6" font-size="12">gender <tspan fill="#8d8d99">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="184" x2="250" y2="184" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="204" fill="#e1e1e6" font-size="12">phone <tspan fill="#8d8d99">(VARCHAR 20)</tspan></text>
    <line x1="0" y1="214" x2="250" y2="214" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="224" fill="#e1e1e6" font-size="12">admit_date <tspan fill="#8d8d99">(DATE)</tspan></text>
  </g>

  <!-- 5. BODY_PARTS TABLE -->
  <g transform="translate(940, 30)" filter="url(#shadow)">
    <rect width="230" height="100" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="230" height="34" rx="6" fill="#292933"/>
    <text x="115" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">body_parts</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">body_part_id <tspan fill="#8d8d99" font-weight="400">(VARCHAR 5)</tspan></text>
    <line x1="0" y1="64" x2="230" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="85" fill="#e1e1e6" font-size="12">body_part_name <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
  </g>

  <!-- 6. WOUNDS TABLE -->
  <g transform="translate(940, 200)" filter="url(#shadow)">
    <rect width="230" height="180" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="230" height="34" rx="6" fill="#292933"/>
    <text x="115" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">wounds</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">wound_id <tspan fill="#8d8d99" font-weight="400">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="64" x2="230" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="64" width="45" height="30" fill="#24242d"/>
    <text x="22" y="84" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="84" fill="#e1e1e6" font-size="12">HN <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="94" x2="230" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="94" width="45" height="30" fill="#24242d"/>
    <text x="22" y="114" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="114" fill="#e1e1e6" font-size="12">body_part_id <tspan fill="#8d8d99">(VARCHAR 5)</tspan></text>
    <line x1="0" y1="124" x2="230" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="144" fill="#e1e1e6" font-size="12">side <tspan fill="#8d8d99">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="154" x2="230" y2="154" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="169" fill="#e1e1e6" font-size="12">created_at <tspan fill="#8d8d99">(DATETIME)</tspan></text>
  </g>

  <!-- 7. APPOINTMENTS TABLE -->
  <g transform="translate(320, 480)" filter="url(#shadow)">
    <rect width="260" height="220" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="260" height="34" rx="6" fill="#292933"/>
    <text x="130" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">appointments</text>
    <line x1="0" y1="34" x2="260" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">appointment_id <tspan fill="#8d8d99" font-weight="400">(INT AUTO)</tspan></text>
    <line x1="0" y1="64" x2="260" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="64" width="45" height="30" fill="#24242d"/>
    <text x="22" y="84" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="84" fill="#e1e1e6" font-size="12">HN <tspan fill="#8d8d99">(VARCHAR 50)</tspan></text>
    <line x1="0" y1="94" x2="260" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="94" width="45" height="30" fill="#24242d"/>
    <text x="22" y="114" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="114" fill="#e1e1e6" font-size="12">nurse_user_id <tspan fill="#8d8d99">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="124" x2="260" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="144" fill="#e1e1e6" font-size="12">appointment_date <tspan fill="#8d8d99">(DATE)</tspan></text>
    <line x1="0" y1="154" x2="260" y2="154" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="174" fill="#e1e1e6" font-size="12">appointment_time <tspan fill="#8d8d99">(TIME)</tspan></text>
    <line x1="0" y1="184" x2="260" y2="184" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="204" fill="#e1e1e6" font-size="12">note <tspan fill="#8d8d99">(TEXT)</tspan></text>
  </g>

  <!-- 8. WOUND_RECORDS TABLE -->
  <g transform="translate(660, 450)" filter="url(#shadow)">
    <rect width="270" height="270" rx="6" fill="#1e1e24" stroke="#33333f" stroke-width="1.5"/>
    <rect width="270" height="34" rx="6" fill="#292933"/>
    <text x="135" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">wound_records</text>
    <line x1="0" y1="34" x2="270" y2="34" stroke="#33333f" stroke-width="1.5"/>

    <rect x="0" y="34" width="45" height="30" fill="#24242d"/>
    <text x="22" y="54" fill="#ff5555" font-size="11" font-weight="700" text-anchor="middle">PK</text>
    <text x="55" y="54" fill="#e1e1e6" font-size="12" font-weight="600">record_id <tspan fill="#8d8d99" font-weight="400">(INT AUTO_INCREMENT)</tspan></text>
    <line x1="0" y1="64" x2="270" y2="64" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="64" width="45" height="30" fill="#24242d"/>
    <text x="22" y="84" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="84" fill="#e1e1e6" font-size="12">wound_id <tspan fill="#8d8d99">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="94" x2="270" y2="94" stroke="#2a2a35" stroke-width="1"/>

    <rect x="0" y="94" width="45" height="30" fill="#24242d"/>
    <text x="22" y="114" fill="#ffb86c" font-size="11" font-weight="700" text-anchor="middle">FK</text>
    <text x="55" y="114" fill="#e1e1e6" font-size="12">user_id <tspan fill="#8d8d99">(VARCHAR 10)</tspan></text>
    <line x1="0" y1="124" x2="270" y2="124" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="144" fill="#e1e1e6" font-size="12">image_path <tspan fill="#8d8d99">(VARCHAR 255)</tspan></text>
    <line x1="0" y1="154" x2="270" y2="154" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="174" fill="#e1e1e6" font-size="12">area_pixel <tspan fill="#8d8d99">(INT)</tspan></text>
    <line x1="0" y1="184" x2="270" y2="184" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="204" fill="#e1e1e6" font-size="12">area_cm2 <tspan fill="#8d8d99">(FLOAT)</tspan></text>
    <line x1="0" y1="214" x2="270" y2="214" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="234" fill="#e1e1e6" font-size="12">record_date <tspan fill="#8d8d99">(DATETIME)</tspan></text>
    <line x1="0" y1="244" x2="270" y2="244" stroke="#2a2a35" stroke-width="1"/>

    <text x="55" y="259" fill="#e1e1e6" font-size="12">note <tspan fill="#8d8d99">(TEXT)</tspan></text>
  </g>
</svg>
